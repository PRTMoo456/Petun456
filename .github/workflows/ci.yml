name: ตรวจโค้ดและสูตรคำนวณ

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nomicha-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nomicha-app/package-lock.json
      - run: npm ci
      - run: TZ=Asia/Bangkok npm test
      - run: npm run build
